syntax = "proto3";
package blackchain.blackchain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "blackchain/x/blackchain/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "blackchain/x/blackchain/Params";
  option (gogoproto.equal) = true;
  
}